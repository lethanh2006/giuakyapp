# Only local development infrastructure runs in Docker.
# Start the NestJS services on the host with `npm run dev`.
name: ${COMPOSE_PROJECT_NAME:-nrapp-local-dev}

services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Transactions require a replica set, even on a single local node.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status(); } catch (error) { if (error.code !== 94) throw error; rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); } if (!db.hello().isWritablePrimary) quit(1);"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nrapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nrapp-local-rabbitmq}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  payment-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PAYMENT_POSTGRES_USER:-nrapp}
      POSTGRES_PASSWORD: ${PAYMENT_POSTGRES_PASSWORD:-nrapp-local-postgres}
      POSTGRES_DB: ${PAYMENT_POSTGRES_DB:-nrapp_payment}
    ports:
      - "127.0.0.1:${PAYMENT_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
  payment_postgres_data:
