x-vps-app: &vps-app
  restart: unless-stopped
  stop_grace_period: 30s
  command: ["node", "dist/main.js"]
  mem_limit: 224m
  healthcheck:
    interval: 30s
    start_period: 40s
  logging: &vps-logging
    driver: local
    options:
      max-size: 5m
      max-file: "2"

x-vps-env: &vps-env
  LOG_FORMAT: json
  LOG_LEVEL: info
  NODE_OPTIONS: --max-old-space-size=128

x-vps-rabbitmq: &vps-rabbitmq
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_AMQP_HOST_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}

services:
  gateway:
    <<: *vps-app
    image: nrapp/gateway:${NRAPP_IMAGE_TAG:-vps-lab-001}
    environment:
      <<: *vps-env
      # Bound the per-token positive decision cache to the Gateway's maximum
      # supported one-second TTL; JWT signature and expiration are still
      # checked locally on every request.
      GATEWAY_AUTH_INTROSPECTION_CACHE_TTL_MS: "1000"
  auth:
    <<: *vps-app
    image: nrapp/auth:${NRAPP_IMAGE_TAG:-vps-lab-001}
    environment:
      <<: [*vps-env, *vps-rabbitmq]
      # Public OAuth client identifier; must match the web/mobile client ID.
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-779200897119-2m0amhfd2prcpuuec18502f14vlfbh3f.apps.googleusercontent.com}
      # One Auth replica; keeps hot credential reads off Atlas. AuthService
      # invalidates this bounded in-process cache after role/email changes or deletion.
      AUTH_IDENTITY_CACHE_TTL_MS: "2000"
  user:
    <<: *vps-app
    image: nrapp/user:${NRAPP_IMAGE_TAG:-vps-lab-001}
    mem_limit: 192m
    environment:
      <<: [*vps-env, *vps-rabbitmq]
  mail:
    <<: *vps-app
    image: nrapp/mail:${NRAPP_IMAGE_TAG:-vps-lab-001}
    mem_limit: 160m
    environment:
      <<: [*vps-env, *vps-rabbitmq]
      NODE_OPTIONS: --max-old-space-size=96
      MAIL_PREFETCH: "2"
  chat:
    <<: *vps-app
    image: nrapp/chat:${NRAPP_IMAGE_TAG:-vps-lab-001}
    environment: *vps-env
  todo:
    <<: *vps-app
    image: nrapp/todo:${NRAPP_IMAGE_TAG:-vps-lab-001}
    mem_limit: 192m
    environment: *vps-env
  workschedule:
    <<: *vps-app
    image: nrapp/workschedule:${NRAPP_IMAGE_TAG:-vps-lab-001}
    environment: *vps-env
  canteen:
    <<: *vps-app
    image: nrapp/canteen:${NRAPP_IMAGE_TAG:-vps-lab-001}
    mem_limit: 256m
    environment:
      <<: [*vps-env, *vps-rabbitmq]
      NODE_OPTIONS: --max-old-space-size=160

  # Casso is unavailable, so Payment remains outside the active app profile.
  payment:
    profiles: !override [payment-later]

  redis:
    mem_limit: 160m
    logging: *vps-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - noeviction
  rabbitmq:
    mem_limit: 384m
    logging: *vps-logging
    volumes:
      - type: bind
        source: ./docker/rabbitmq.vps.conf
        target: /etc/rabbitmq/rabbitmq.conf
        read_only: true
        bind:
          create_host_path: false
  payment-postgres:
    profiles: [payment-later]
