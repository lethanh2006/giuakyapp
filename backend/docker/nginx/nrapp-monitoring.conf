map $http_upgrade $nrapp_monitoring_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name grafana-vps.thanhlelmtp2006.id.vn;

    location / {
        include /etc/nginx/snippets/nrapp-monitoring-access.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nrapp_monitoring_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

