name: Reusable VPS CD

on:
  workflow_call:
    inputs:
      service-name:
        description: Compose service and nrapp image name
        required: true
        type: string
      deploy-revision:
        description: Exact service commit that passed CI
        required: true
        type: string
      default-branch:
        description: Caller repository default branch
        required: true
        type: string
      platform-ref:
        description: Immutable Logger commit containing build assets
        required: true
        type: string
    secrets:
      VPS_SSH_PRIVATE_KEY:
        description: Per-service restricted deployment key
        required: true

permissions:
  contents: read

jobs:
  preflight:
    name: Validate deployment revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-deploy: ${{ steps.revision.outputs.should-deploy }}
    steps:
      - name: Reject invalid or stale revisions
        id: revision
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          DEPLOY_REVISION: ${{ inputs.deploy-revision }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
        run: |
          set -euo pipefail

          case "$SERVICE_NAME" in
            gateway|auth|user|mail|chat|todo|workschedule|canteen) ;;
            *)
              echo "::error::Service is not allowed for VPS deployment"
              exit 1
              ;;
          esac

          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Deployment revision is not a full Git SHA"
            exit 1
          }

          case "$DEFAULT_BRANCH" in
            main|master) ;;
            *)
              echo "::error::Unexpected default branch"
              exit 1
              ;;
          esac

          current_revision="$(
            git ls-remote \
              --exit-code \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/heads/${DEFAULT_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"

          [[ "$current_revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve the default branch revision"
            exit 1
          }

          if [[ "$DEPLOY_REVISION" != "$current_revision" ]]; then
            echo "Skip stale revision $DEPLOY_REVISION; current is $current_revision"
            echo "should-deploy=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should-deploy=true" >>"$GITHUB_OUTPUT"

  deploy:
    name: Build image and deploy to VPS
    needs: preflight
    if: needs.preflight.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ${{ github.repository }}-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://api-vps.thanhlelmtp2006.id.vn
    env:
      SERVICE_NAME: ${{ inputs.service-name }}
      DEPLOY_REVISION: ${{ inputs.deploy-revision }}
      VPS_HOST: 103.116.52.35
      VPS_PORT: "22"
      VPS_USER: deploy

    steps:
      - name: Checkout service revision that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deploy-revision }}
          path: service
          persist-credentials: false

      - name: Checkout shared platform assets
        uses: actions/checkout@v7
        with:
          repository: lethanh2006/Logger
          ref: ${{ inputs.platform-ref }}
          path: logger
          sparse-checkout: |
            deploy
            packages/observability
          persist-credentials: false

      - name: Validate deployment secret
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$VPS_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Missing VPS_SSH_PRIVATE_KEY secret"
            exit 1
          fi

      - name: Build production image
        run: |
          set -euo pipefail
          image="nrapp/${SERVICE_NAME}:vps-lab-001"

          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --file logger/deploy/node-service.Dockerfile \
            --build-arg SERVICE_DIR=service \
            --label "org.opencontainers.image.revision=${DEPLOY_REVISION}" \
            --tag "$image" \
            .

          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "amd64"

      - name: Package and validate image
        run: |
          set -euo pipefail
          image="nrapp/${SERVICE_NAME}:vps-lab-001"
          archive="$RUNNER_TEMP/nrapp-image.tar.gz"

          docker image save "$image" | gzip -1 >"$archive"
          gzip -t "$archive"
          sha256sum "$archive"

          archive_size="$(stat -c '%s' "$archive")"
          if (( archive_size >= 512 * 1024 * 1024 )); then
            echo "::error::Image archive exceeds the VPS receiver limit"
            exit 1
          fi

      - name: Configure restricted SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            >"$HOME/.ssh/nrapp_github_cd"
          chmod 600 "$HOME/.ssh/nrapp_github_cd"
          install -m 600 logger/deploy/vps-known_hosts "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/nrapp_github_cd" >/dev/null

      - name: Deploy and wait for healthcheck
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nrapp-image.tar.gz"

          for attempt in 1 2 3; do
            if ssh \
              -T \
              -p "$VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i "$HOME/.ssh/nrapp_github_cd" \
              "$VPS_USER@$VPS_HOST" \
              "deploy ${SERVICE_NAME} ${DEPLOY_REVISION}" \
              <"$archive"; then
              exit 0
            fi

            if [[ "$attempt" == 3 ]]; then
              echo "::error::Deployment failed after 3 SSH attempts"
              exit 1
            fi

            sleep "$((attempt * 20))"
          done

      - name: Remove SSH private key
        if: always()
        run: rm -f -- "$HOME/.ssh/nrapp_github_cd"
